name: Test meeting application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
      - run: python -m pip install uv==0.12.3
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s tests -q
      - run: uv run ruff check server scripts tests speech_worker
      - run: uv run python -m scripts.audit_submission --history --output "$RUNNER_TEMP/source-audit.json"
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm --prefix desktop test
