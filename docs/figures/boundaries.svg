<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title description">
<title id="title">Model output is a proposal, not authority.</title><desc id="description">The server validates transcript references, source-specific quote IDs, exact quotation spans and current session/claim versions. These gates constrain provenance and shape, not the semantic truth of all model interpretations.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#586777"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e8b"/></marker>
<marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#6d55a4"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a96615"/></marker>
<marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34d3d"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="35" font-size="14" fill="#586777" font-weight="700" letter-spacing="2" text-anchor="start">GROUNDED / FIGURE 07</text>
<text x="40" y="80" font-size="30" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Model output is a proposal, not authority.</text>
<text x="40" y="112" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Server-side gates control what becomes a visible finding.</text>
<path d="M40 642 L1040 642" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="40" y="668" font-size="13" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Grounded · See Visual Atlas for assumptions, measurement scope and source mapping</text>
<rect x="40" y="155" width="480" height="132" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M56 173 V269" stroke="#6d55a4" stroke-width="4"/>
<text x="72" y="189" font-size="20" fill="#6d55a4" font-weight="700" letter-spacing="0" text-anchor="start">1  Known transcript IDs</text>
<text x="72" y="221" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Do not invent the utterance.</text>
<rect x="560" y="155" width="480" height="132" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M576 173 V269" stroke="#6d55a4" stroke-width="4"/>
<text x="592" y="189" font-size="20" fill="#6d55a4" font-weight="700" letter-spacing="0" text-anchor="start">2  Retrieved quote options</text>
<text x="592" y="221" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">The server owns source IDs and URLs.</text>
<rect x="40" y="325" width="480" height="132" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M56 343 V439" stroke="#2563a6" stroke-width="4"/>
<text x="72" y="359" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">3  Schema + exact-span checks</text>
<text x="72" y="391" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Reject unknown or fabricated citations.</text>
<rect x="560" y="325" width="480" height="132" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M576 343 V439" stroke="#2563a6" stroke-width="4"/>
<text x="592" y="359" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">4  Current-state checks</text>
<text x="592" y="391" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Session, epoch and revision must match.</text>
<rect x="40" y="510" width="1000" height="110" rx="12" fill="#fbf2e5" stroke="#fbf2e5" stroke-width="1"/>
<text x="64" y="545" font-size="22" fill="#a96615" font-weight="700" letter-spacing="0" text-anchor="start">NO READABLE EVIDENCE ≠ FALSE</text>
<text x="64" y="581" font-size="18" fill="#24313f" font-weight="400" letter-spacing="0" text-anchor="start">Return insufficient evidence. A valid quote still does not prove a valid interpretation.</text>
</g></svg>
