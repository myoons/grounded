<text x="220" y="682" font-size="19" fill="#24313f" font-weight="400" letter-spacing="0" text-anchor="start">Transcript + receipt become durable together.</text>
<text x="62" y="721" font-size="17" fill="#b34d3d" font-weight="700" letter-spacing="0" text-anchor="start">ROLLBACK</text>
<text x="220" y="721" font-size="17" fill="#24313f" font-weight="400" letter-spacing="0" text-anchor="start">Prior rows remain; no acknowledgement authorizes audio deletion.</text>
