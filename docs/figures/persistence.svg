<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830" role="img" aria-labelledby="title description">
<title id="title">Relationships survive; partial commits do not.</title><desc id="description">A grouped relational map, not every foreign key. Meeting-scoped composite keys link immutable transcript rows to claim revisions, research and citations. Audio outcome and receipt commit atomically before local deletion.</desc>
