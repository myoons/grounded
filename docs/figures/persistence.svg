<text x="760" y="500" font-size="20" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Composite ownership keys</text>
<text x="760" y="534" font-size="16" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">meeting + claim + revision</text>
<text x="760" y="560" font-size="16" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">prevent cross-version citations.</text>
