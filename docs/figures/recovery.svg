<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="title description">
<title id="title">Failures stop at the narrowest safe boundary.</title><desc id="description">Research failures leave transcription running. Durable encrypted audio survives processing backlog; local storage exhaustion stops new intake without evicting retained chunks. Explicit recovery resumes interrupted work. These are mechanisms, not measured reliability percentages.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#586777"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e8b"/></marker>
<marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#6d55a4"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a96615"/></marker>
<marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34d3d"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="35" font-size="14" fill="#586777" font-weight="700" letter-spacing="2" text-anchor="start">GROUNDED / FIGURE 08</text>
<text x="40" y="80" font-size="30" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Failures stop at the narrowest safe boundary.</text>
<text x="40" y="112" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Six small multiples: failure → preserved behavior → explicit recovery.</text>
<path d="M40 702 L1040 702" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="40" y="728" font-size="13" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Grounded · See Visual Atlas for assumptions, measurement scope and source mapping</text>
<rect x="40" y="150" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M56 168 V277" stroke="#2563a6" stroke-width="4"/>
<text x="72" y="184" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">Audio backlog</text>
<text x="72" y="216" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Keep encrypted saved chunks.</text>
<text x="72" y="241" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Retry bounded processing.</text>
<rect x="560" y="150" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M576 168 V277" stroke="#6d55a4" stroke-width="4"/>
<text x="592" y="184" font-size="20" fill="#6d55a4" font-weight="700" letter-spacing="0" text-anchor="start">Detector failure</text>
<text x="592" y="216" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Keep the transcript flowing.</text>
<text x="592" y="241" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Use Retry checks.</text>
<rect x="40" y="320" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M56 338 V447" stroke="#a96615" stroke-width="4"/>
<text x="72" y="354" font-size="20" fill="#a96615" font-weight="700" letter-spacing="0" text-anchor="start">Search failure</text>
<text x="72" y="386" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Mark only that card failed.</text>
<text x="72" y="411" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Retry that research job.</text>
<rect x="560" y="320" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M576 338 V447" stroke="#a96615" stroke-width="4"/>
<text x="592" y="354" font-size="20" fill="#a96615" font-weight="700" letter-spacing="0" text-anchor="start">No useful sources</text>
<text x="592" y="386" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Show insufficient evidence.</text>
<text x="592" y="411" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Inspect context or retry.</text>
<rect x="40" y="490" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M56 508 V617" stroke="#24313f" stroke-width="4"/>
<text x="72" y="524" font-size="20" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Storage failure</text>
<text x="72" y="556" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Keep last committed history.</text>
<text x="72" y="581" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Fix disk; retry saving.</text>
<rect x="560" y="490" width="480" height="145" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M576 508 V617" stroke="#2563a6" stroke-width="4"/>
<text x="592" y="524" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">Service restart</text>
<text x="592" y="556" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Committed rows remain.</text>
<text x="592" y="581" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Explicitly resume pending work.</text>
<text x="40" y="685" font-size="19" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">An error is not a verdict. A retry is not permission to replay old audio.</text>
</g></svg>
