<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title description">
<title id="title">Three places. One continuous conversation.</title><desc id="description">Ownership map, not a network topology. The local service may run on the same Mac or a trusted SSH-connected Mac. Whisper is our custom endpoint; Kimi is managed; Firecrawl is external.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#586777"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e8b"/></marker>
<marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#6d55a4"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#a96615"/></marker>
<marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b34d3d"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="35" font-size="14" fill="#586777" font-weight="700" letter-spacing="2" text-anchor="start">GROUNDED / FIGURE 01</text>
<text x="40" y="80" font-size="30" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Three places. One continuous conversation.</text>
<text x="40" y="112" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Capture stays on the participant&#x27;s Mac. The service owns state. Providers perform heavy work.</text>
<path d="M40 652 L1040 652" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="40" y="678" font-size="13" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Grounded · See Visual Atlas for assumptions, measurement scope and source mapping</text>
<rect x="40" y="148" width="300" height="420" rx="12" fill="#f5f7fa" stroke="#ccd6df" stroke-width="1"/>
<text x="60" y="181" font-size="17" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">A  PARTICIPANT MAC</text>
<text x="60" y="208" font-size="15" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Permissions + presentation</text>
<rect x="390" y="148" width="300" height="420" rx="12" fill="#f5f7fa" stroke="#ccd6df" stroke-width="1"/>
<text x="410" y="181" font-size="17" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">B  TRUSTED SERVICE</text>
<text x="410" y="208" font-size="15" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Consistency + private storage</text>
<rect x="740" y="148" width="300" height="420" rx="12" fill="#f5f7fa" stroke="#ccd6df" stroke-width="1"/>
<text x="760" y="181" font-size="17" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">C  PROVIDERS</text>
<text x="760" y="208" font-size="15" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Authenticated external calls</text>
<rect x="56" y="235" width="268" height="118" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M72 253 V335" stroke="#2563a6" stroke-width="4"/>
<text x="88" y="269" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">Capture</text>
<text x="88" y="301" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Microphone + Core Audio</text>
<text x="88" y="326" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">16 kHz PCM; bounded chunks</text>
<rect x="56" y="390" width="268" height="140" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M72 408 V512" stroke="#2563a6" stroke-width="4"/>
<text x="88" y="424" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">View</text>
<text x="88" y="456" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Live script + claim cards</text>
<text x="88" y="481" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Past meetings</text>
<text x="88" y="506" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">No new recording on reopen</text>
<rect x="406" y="235" width="268" height="118" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M422 253 V335" stroke="#2563a6" stroke-width="4"/>
<text x="438" y="269" font-size="20" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">Orchestrate</text>
<text x="438" y="301" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Epochs, queues, revisions</text>
<text x="438" y="326" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Validate before publishing</text>
<rect x="406" y="390" width="268" height="140" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M422 408 V512" stroke="#24313f" stroke-width="4"/>
<text x="438" y="424" font-size="20" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Remember</text>
<text x="438" y="456" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Relational SQLite history</text>
<text x="438" y="481" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Transcript, findings, view</text>
<text x="438" y="506" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">No original audio files</text>
<rect x="756" y="235" width="268" height="89" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M772 253 V306" stroke="#087e8b" stroke-width="4"/>
<text x="788" y="269" font-size="20" fill="#087e8b" font-weight="700" letter-spacing="0" text-anchor="start">Runpod / our GPU</text>
<text x="788" y="301" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Whisper large-v3</text>
<rect x="756" y="345" width="268" height="89" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M772 363 V416" stroke="#6d55a4" stroke-width="4"/>
<text x="788" y="379" font-size="20" fill="#6d55a4" font-weight="700" letter-spacing="0" text-anchor="start">Runpod / public API</text>
<text x="788" y="411" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Kimi K3: extract + synthesize</text>
<rect x="756" y="455" width="268" height="89" rx="12" fill="#ffffff" stroke="#ccd6df" stroke-width="1"/>
<path d="M772 473 V526" stroke="#a96615" stroke-width="4"/>
<text x="788" y="489" font-size="20" fill="#a96615" font-weight="700" letter-spacing="0" text-anchor="start">Firecrawl</text>
<text x="788" y="521" font-size="17" fill="#586777" font-weight="400" letter-spacing="0" text-anchor="start">Search + readable sources</text>
<path d="M324 284 L406 284" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M674 284 L710 284" fill="none" stroke="#586777" stroke-width="2"/>
<path d="M710 284 L710 500" fill="none" stroke="#586777" stroke-width="2"/>
<path d="M710 284 L756 284" fill="none" stroke="#087e8b" stroke-width="2" marker-end="url(#arrow-teal)"/>
<path d="M710 390 L756 390" fill="none" stroke="#6d55a4" stroke-width="2" marker-end="url(#arrow-purple)"/>
<path d="M710 500 L756 500" fill="none" stroke="#a96615" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M406 448 L324 448" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="335" y="438" font-size="14" fill="#2563a6" font-weight="400" letter-spacing="0" text-anchor="start">Saved</text>
<path d="M406 328 L365 328 L365 372 L190 372 L190 390" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="260" y="365" font-size="14" fill="#2563a6" font-weight="400" letter-spacing="0" text-anchor="start">Live</text>
<path d="M540 353 L540 390" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="40" y="610" font-size="19" fill="#2563a6" font-weight="700" letter-spacing="0" text-anchor="start">Localhost or SSH</text>
<text x="300" y="610" font-size="19" fill="#24313f" font-weight="700" letter-spacing="0" text-anchor="start">Keys remain server-side</text>
<text x="665" y="610" font-size="19" fill="#a96615" font-weight="700" letter-spacing="0" text-anchor="start">No public multi-user API</text>
</g></svg>
